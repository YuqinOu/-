<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>To 扬子 · 送给最最亲爱的扬子</title>
<meta name="description" content="一本关于舒名扬（扬子、梅子干）的相册，三十四张照片。" />
<meta name="theme-color" content="#3a1622" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&family=Caveat:wght@400;600&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="hero-books.css" />
<link rel="stylesheet" href="letter.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%233a1622'/%3E%3Cpath d='M50 18 C52 36 54 46 54 50 C68 47 82 45 88 47 C72 55 58 61 54 63 C58 76 60 85 58 90 C50 76 44 65 42 63 C29 70 18 74 13 72 C26 61 35 54 38 50 C34 38 32 27 34 20 C40 33 46 43 50 46 C50 35 50 24 50 18Z' fill='none' stroke='%23f6d97a' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>

<div class="grain" aria-hidden="true"></div>


<main>

  <!-- ═══════════ HERO · Folio 式开场（照片底 + 3D 书列） ═══════════ -->
  <section class="fh" id="top">

    <div class="fh-bg" aria-hidden="true">
      <img class="fh-bg-fill" src="assets/img/hero-bg.jpg" alt="" decoding="async" />
      <img class="fh-bg-main" src="assets/img/hero-bg.jpg" alt="" decoding="async" fetchpriority="high" />
      <span class="fh-veil"></span>
    </div>

    <header class="fh-nav">
      <a class="fh-logo" href="#top" aria-label="回到开头">
        <span class="fh-mark" aria-hidden="true"><i></i></span>
        <span class="fh-word"><b>Yangzi</b><small>an album for you</small></span>
      </a>

      <div class="fh-right">
        <a class="fh-pill" href="#album">Start here</a>
      </div>
    </header>

    <div class="fh-title" aria-hidden="true">To 扬子</div>
    <h1 class="visually-hidden">To 扬子 — 送给最最亲爱的扬子</h1>

    <nav class="fh-row" aria-label="相册索引">
      <a href="#album">我们的照片</a>
      <span>34 张照片</span>
      <span>舒名扬</span>
    </nav>

    <canvas id="fhCanvas" aria-hidden="true"></canvas>
    <div class="fh-tail" aria-hidden="true"></div>

    <a class="fh-scroll" href="#album" aria-label="继续向下">
      <span aria-hidden="true"></span>
      向下
    </a>
  </section>

  <!-- ═══════════ ALBUM ═══════════ -->
  <section class="album" id="album">
    <div class="album-inner">
      <div class="album-head">
        <p class="kicker">TIN CASE COLLECTION · 34 PHOTOS</p>
        <h2 class="album-title">我们在一起的<br>点点滴滴</h2>
      </div>

      <div id="gallery"></div>
      <noscript><p class="noscript">相册需要开启 JavaScript 才能显示。</p></noscript>
    </div>
  </section>

  <!-- ═══════════ 尾页 · 一封信 ═══════════ -->
  <section class="letter-sec" id="letter">
    <p class="env-kicker">LAST PAGE · 一封信</p>
    <h2 class="env-title">还有一封信，留给你</h2>

    <button class="env-btn" id="envOpen" type="button" aria-haspopup="dialog" aria-controls="letterModal" aria-label="打开给扬子的信">
      <span class="env-obj" id="envObj" aria-hidden="true">
        <span class="env-note"></span>
        <span class="env-front">
          <span class="env-fold-l"></span>
          <span class="env-fold-r"></span>
          <span class="env-fold-b"></span>
          <span class="env-addr">to 扬子</span>
        </span>
        <span class="env-flap"><span class="env-seal"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 20.5C12 20.5 3.2 15.2 3.2 9.5c0-2.3 1.7-3.9 3.9-3.9 1.9 0 3.8 1.6 4.9 3.3 1.1-1.7 3-3.3 4.9-3.3 2.2 0 3.9 1.6 3.9 3.9 0 5.7-8.8 11-8.8 11z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
      </span>
      <span class="env-hint">点开</span>
    </button>
  </section>

</main>

<!-- 信纸 -->
<div class="letter-modal" id="letterModal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="给扬子的一封信">
  <button class="letter-close" id="letterClose" aria-label="合上信纸">✕</button>
  <div class="letter-sheet">
    <span class="letter-tape" aria-hidden="true"></span>
    <div class="letter-lines">
      <p>扬子：展信佳，看到这封信的时候有没有想起我的样子？我真的好想你呀！</p>
      <p>最近因为发生了一些不好的事情让你很难过，我也很难过，但是我想说忘记过去的不愉快，拥抱幸福，记录和感受所有美好。</p>
      <p>这个世界那么大，总有新的事物在等着我们，请勇敢的在每一个当下出发，我们一直在你的身后！</p>
    </div>
  </div>
</div>

<!-- 大图 -->
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="查看照片">
  <button class="lb-close" id="lbClose" aria-label="关闭">✕</button>
  <button class="lb-prev" id="lbPrev" aria-label="上一张">‹</button>
  <button class="lb-next" id="lbNext" aria-label="下一张">›</button>
  <figure class="lb-figure">
    <img id="lbImg" src="" alt="">
    <figcaption>
      <span class="mono" id="lbCount"></span>
    </figcaption>
  </figure>
</div>

<script src="main.js"></script>
<script type="module" src="hero-books.js"></script>
</body>
</html>
